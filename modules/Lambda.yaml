AWSTemplateFormatVersion: "2010-09-09"
Description: ""
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
      - shared
Resources:

    VariablesReportLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            FunctionName: "variables-report"
            Description: "Variables Report Lambda Function"
            Environment: 
                Variables: 
                    CORE_VARIABLES_UPLOAD_PATH: "variables-explorer/core_variables_data_model.json"
                    VARIABLE_REPORT_PATH: "variables-explorer/Complete-Data-Variable-Report.xlsx"
                    BUCKET: "radxdatahub.nih.gov"
                    ALL_VARS_UPLOAD_PATH: "variables-explorer/all_variables_data_model.json"
                    SECRET_NAME: "application_prod"
                    REPORT_NAME: "Complete-Data-Variable-Report.xlsx"
                    TEMPLATE_REPORT_PATH: "variables-report/Template Variable Report.xlsx"
                    REGION: !Ref AWS::Region
                    
            Handler: "lambda_function.lambda_handler"
            Architectures: 
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from Variables Report Lambda!')
                        }
            MemorySize: 512
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaExecutionRole"
            Runtime: "python3.11"
            Timeout: 60
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            # Layers: 
            #   - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:psycopg2-custom:1"
            #   - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python311:16"
            EphemeralStorage: 
                Size: 512

    MacieJobStatusCheckerLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "Macie Job Status Checker Lambda Function"
            FunctionName: "check-macie-job-status"
            Handler: "lambda_function.lambda_handler"
            Architectures: 
              - "arm64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from Macie Job Status Checker!')
                        }
            MemorySize: 128
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaExecutionRole"
            Runtime: "python3.12"
            Timeout: 10
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            EphemeralStorage: 
                Size: 512
    RADxReporterTestLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "RADx Reporter Test Lambda Function"
            FunctionName: "radx-reporter-test"
            Architectures: 
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from RADx Reporter Test!')
                        }
            MemorySize: 1024
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaExecutionRole"
            Timeout: 60
            Runtime: "python3.11"
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            EphemeralStorage: 
                Size: 512

    SageMakerCanvasAutoShutdownLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: ""
            Environment: 
                Variables: 
                    TIMEOUT_THRESHOLD: "900"
                    ALARM_PERIOD: "600"
            FunctionName: "sagemaker-canvas-auto-shutdown-on-idle-DeleteCanvasAppFunction"
            Handler: "index.lambda_handler"
            Architectures: 
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from SageMaker Canvas Auto Shutdown!')
                        }
            MemorySize: 128
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/sagemaker-canvas-auto-shutdown--LambdaExecutionRole-bNXf55NeoQdf"
            Runtime: "python3.11"
            Timeout: 30
            TracingConfig: 
                Mode: "PassThrough"
            EphemeralStorage: 
                Size: 512

    RADxEmailServiceLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "RADx Email Service Lambda Function"
            Environment: 
                Variables: 
                    SPRING_PROFILES_ACTIVE: "test"
            FunctionName: "RADx-EmailService"
            Handler: "org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest"
            Architectures: 
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from RADx Email Service!')
                        }
            MemorySize: 2048
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/ses-sqs-lambda-role-cme1rbbm"
            Runtime: "java17"
            Timeout: 60
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            EphemeralStorage: 
                Size: 512

    RADxOpenSearchRefreshLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: ""
            Environment: 
                Variables: 
                    REGION_NAME: "us-east-1"
                    SECRET_NAME: "application_prod"
                    ALIAS_NAME: "study_search"
                    INDEX_NAME: "study_v101"
            FunctionName: "RADx-OpenSearchRefresh"
            Architectures: 
              - "arm64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from OpenSearch Refresh!')
                        }
            MemorySize: 1024
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaExecutionRole"
            Timeout: 900
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            EphemeralStorage: 
                Size: 512

    RADxPublicationScriptLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: ""
            FunctionName: "RADx-PublicationScript"
            Architectures: 
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from Publication Script!')
                        }
            MemorySize: 128
            Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaExecutionRole"
            Timeout: 60
            TracingConfig: 
                Mode: "PassThrough"
            VpcConfig: 
                SubnetIds: 
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds: 
                  - Fn::ImportValue: !Sub "RADx-ECS-${Environment}-Lambda-SecurityGroup"
            EphemeralStorage: 
                Size: 512

    VariablesReportLambdaPermission:
        Type: "AWS::Lambda::Permission"
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !GetAtt VariablesReportLambda.Arn
            Principal: "events.amazonaws.com"
            SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/VARIABLES-REPORT"

    SageMakerCanvasAutoShutdownLambdaPermission:
        Type: "AWS::Lambda::Permission"
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !GetAtt SageMakerCanvasAutoShutdownLambda.Arn
            Principal: "events.amazonaws.com"
            SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/sagemaker-canvas-auto-shutdown-on-idle-CanvasAutoShutdownRule"
