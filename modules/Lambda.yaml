AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "Lambda Functions and IAM Roles"
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  DataHubUniqueId:
    Type: String
    Description: A unique identifier to ensure S3 bucket names are globally unique
  ProjectName:
    Type: String
    Description: Project name for resource naming
    Default: datahub

Resources:
  # ============================================================================
  # PREREQUISITE: Upload these S3 objects before deploying this stack:
  #   - s3://${ProjectName}-lambda-artifacts-${DataHubUniqueId}-${Environment}/email-service/datahub-service-email-0.0.1-SNAPSHOT-aws.jar
  #   - s3://${ProjectName}-lambda-artifacts-${DataHubUniqueId}-${Environment}/opensearch-refresh/opensearch-refresh-lambda.zip
  # ============================================================================
  # IAM ROLES
  # ============================================================================

  # Lambda Execution Role for OpenSearch Refresh and other general Lambda functions
  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${ProjectName}-LambdaExecutionRole"
      Description: !Sub "Execution role for ${ProjectName} Lambda functions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: "LambdaSecretsManagerAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}_application_${Environment}-*"
        - PolicyName: "LambdaRDSAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                Resource: "*"
        - PolicyName: "LambdaOpenSearchAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "es:ESHttpDelete"
                  - "es:ESHttpGet"
                  - "es:ESHttpHead"
                  - "es:ESHttpPost"
                  - "es:ESHttpPut"
                  - "es:DescribeElasticsearchDomain"
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
        - PolicyName: "LambdaS3Access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-*/*"

  # Lambda Execution Role for Email Service (SES/SQS)
  SESLambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${ProjectName}-ses-sqs-lambda-role-cme1rbbm"
      Description: !Sub "Execution role for ${ProjectName} Email Service Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: "LambdaSESAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ses:SendEmail"
                  - "ses:SendRawEmail"
                  - "ses:SendTemplatedEmail"
                  - "ses:GetSendQuota"
                Resource: "*"
        - PolicyName: "LambdaSQSAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "sqs:ReceiveMessage"
                  - "sqs:DeleteMessage"
                  - "sqs:GetQueueAttributes"
                  - "sqs:SendMessage"
                Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: "LambdaSecretsManagerAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}_application_${Environment}-*"
        - PolicyName: "LambdaS3Access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-*/*"

