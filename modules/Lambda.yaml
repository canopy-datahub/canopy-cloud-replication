Outputs:
  VariablesReportLambdaArn:
    Description: "Variables Report Lambda ARN"
    Value: !GetAtt VariablesReportLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-VariablesReportLambda-Arn"

  MacieJobStatusCheckerLambdaArn:
    Description: "Macie Job Status Checker Lambda ARN"
    Value: !GetAtt MacieJobStatusCheckerLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-MacieJobStatusCheckerLambda-Arn"

  RADxReporterTestLambdaArn:
    Description: "RADx Reporter Test Lambda ARN"
    Value: !GetAtt RADxReporterTestLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-RADxReporterTestLambda-Arn"

  SageMakerCanvasAutoShutdownLambdaArn:
    Description: "SageMaker Canvas Auto Shutdown Lambda ARN"
    Value: !GetAtt SageMakerCanvasAutoShutdownLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-SageMakerCanvasAutoShutdownLambda-Arn"

  RADxEmailServiceLambdaArn:
    Description: "RADx Email Service Lambda ARN"
    Value: !GetAtt RADxEmailServiceLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-RADxEmailServiceLambda-Arn"

  RADxOpenSearchRefreshLambdaArn:
    Description: "RADx OpenSearch Refresh Lambda ARN"
    Value: !GetAtt RADxOpenSearchRefreshLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-RADxOpenSearchRefreshLambda-Arn"

  RADxPublicationScriptLambdaArn:
    Description: "RADx Publication Script Lambda ARN"
    Value: !GetAtt RADxPublicationScriptLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-${Environment}-RADxPublicationScriptLambda-Arn"
