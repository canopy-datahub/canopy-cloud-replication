AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "Lambda Functions and IAM Roles"
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  DeploymentId:
    Type: String
    Description: A unique identifier to ensure S3 bucket names are globally unique
  ProjectName:
    Type: String
    Description: Project name for resource naming
    Default: datahub
  LambdaDependencyLayerArn:
    Type: String
    Description: ARN of Lambda Dependency Layer

Resources:
  # ============================================================================
  # PREREQUISITE: Upload these S3 objects before deploying this stack:
  #   - s3://${ProjectName}-lambda-artifacts-${DeploymentId}-${Environment}/email-service/datahub-service-email-0.0.1-SNAPSHOT-aws.jar
  #   - s3://${ProjectName}-lambda-artifacts-${DeploymentId}-${Environment}/opensearch-refresh/opensearch-refresh-lambda.zip
  # ============================================================================
  # IAM ROLES
  # ============================================================================

  # Lambda Execution Role for OpenSearch Refresh and other general Lambda functions
  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${ProjectName}-LambdaExecutionRole"
      Description: !Sub "Execution role for ${ProjectName} Lambda functions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: "LambdaSecretsManagerAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}_application_${Environment}-*"
        - PolicyName: "LambdaRDSAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                Resource: "*"
        - PolicyName: "LambdaOpenSearchAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "es:ESHttpDelete"
                  - "es:ESHttpGet"
                  - "es:ESHttpHead"
                  - "es:ESHttpPost"
                  - "es:ESHttpPut"
                  - "es:DescribeElasticsearchDomain"
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
        - PolicyName: "LambdaS3Access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-*/*"

  # Lambda Execution Role for Email Service (SES/SQS)
  SESLambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${ProjectName}-ses-sqs-lambda-role-cme1rbbm"
      Description: !Sub "Execution role for ${ProjectName} Email Service Lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: "LambdaSESAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ses:SendEmail"
                  - "ses:SendRawEmail"
                  - "ses:SendTemplatedEmail"
                  - "ses:GetSendQuota"
                Resource: "*"
        - PolicyName: "LambdaSQSAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "sqs:ReceiveMessage"
                  - "sqs:DeleteMessage"
                  - "sqs:GetQueueAttributes"
                  - "sqs:SendMessage"
                Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*"
        - PolicyName: "LambdaSecretsManagerAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}_application_${Environment}-*"
        - PolicyName: "LambdaS3Access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-*/*"

  DataHubEmailServiceLambda:
    Type: "AWS::Lambda::Function"
    DependsOn: SESLambdaExecutionRole
    Properties:
      Description: !Sub "${ProjectName} Email Service Lambda Function"
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: "dev"
      FunctionName: !Sub "${ProjectName}-EmailService"
      Handler: "org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest"
      Architectures:
        - "x86_64"
      Code:
        S3Bucket: !Sub "${ProjectName}-lambda-artifacts-${DeploymentId}-${Environment}"
        S3Key: !Sub "email-service/datahub-service-email-0.0.1-SNAPSHOT-aws.jar"
      MemorySize: 2048
      Role: !GetAtt SESLambdaExecutionRole.Arn
      Runtime: "java17"
      Timeout: 60
      TracingConfig:
        Mode: "PassThrough"
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-Private-Subnet-AZ1"
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-Private-Subnet-AZ2"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-ECS-Host-SecurityGroup"
      EphemeralStorage:
        Size: 512

  DataHubOpenSearchRefreshLambda:
    Type: "AWS::Lambda::Function"
    DependsOn: LambdaExecutionRole
    Properties:
      Description: "Refreshes OpenSearch indices (study_search, variable_search, autocomplete) from RDS database"
      Environment:
        Variables:
          REGION_NAME: "us-east-1"
          SECRET_NAME: !Sub "${ProjectName}_application_${Environment}"
      FunctionName: !Sub "${ProjectName}-OpenSearchRefresh"
      Handler: "opensearch_reindex_aws.lambda_handler"
      Architectures:
        - "arm64"
      Code:
        S3Bucket: !Sub "${ProjectName}-lambda-artifacts-${DeploymentId}-${Environment}"
        S3Key: "opensearch-refresh/opensearch-refresh-lambda.zip"
      Layers:
        - !Sub "${LambdaDependencyLayerArn}"
      MemorySize: 2048
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: "python3.11"
      Timeout: 900
      TracingConfig:
        Mode: "PassThrough"
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-Private-Subnet-AZ1"
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-Private-Subnet-AZ2"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-Networking-${Environment}-ECS-Host-SecurityGroup"
      EphemeralStorage:
        Size: 1024


  EmailServiceSQSEventSourceMapping:
    Type: "AWS::Lambda::EventSourceMapping"
    Properties:
      BatchSize: 10
      EventSourceArn:
        Fn::ImportValue: !Sub "${ProjectName}-SQS-${Environment}-EmailQueue-Arn"
      FunctionName: !Ref DataHubEmailServiceLambda
      Enabled: true
      MaximumBatchingWindowInSeconds: 0

Outputs:
  DataHubEmailServiceLambdaArn:
    Description: "Email Service Lambda ARN"
    Value: !GetAtt DataHubEmailServiceLambda.Arn
    Export:
      Name: !Sub "${ProjectName}-Lambda-${Environment}-EmailServiceLambda-Arn"

  DataHubOpenSearchRefreshLambdaArn:
    Description: "OpenSearch Refresh Lambda ARN"
    Value: !GetAtt DataHubOpenSearchRefreshLambda.Arn
    Export:
      Name: !Sub "${ProjectName}-Lambda-${Environment}-OpenSearchRefreshLambda-Arn"

  LambdaExecutionRoleArn:
    Description: "ARN of the Lambda Execution Role"
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-Lambda-${Environment}-LambdaExecutionRole-Arn"

  SESLambdaExecutionRoleArn:
    Description: "ARN of the SES Lambda Execution Role"
    Value: !GetAtt SESLambdaExecutionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-Lambda-${Environment}-SESLambdaExecutionRole-Arn"
