AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "SNS Topics stack"
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: datahub

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    AlertsEmailTopic:
        Type: "AWS::SNS::Topic"
        Properties:
            DisplayName: !Sub "${ProjectName} Alerts Email ${Environment}"
            TopicName: !Sub "${ProjectName}-alerts-email-${Environment}"

    AlertsTopic:
        Type: "AWS::SNS::Topic"
        Properties:
            DisplayName: !Sub "${ProjectName} Alerts ${Environment}"
            TopicName: !Sub "${ProjectName}-alerts-${Environment}"

    AlertsDhpTopic:
        Type: "AWS::SNS::Topic"
        Properties:
            DisplayName: !Sub "${ProjectName} Alerts DHP ${Environment}"
            TopicName: !Sub "${ProjectName}-alerts-dhp-${Environment}"
            KmsMasterKeyId: "alias/aws/sns"

    AlertsEmailTopicPolicy:  ## Will need some revisions to policy document - Sids etc...
        Type: "AWS::SNS::TopicPolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2008-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__default_statement_ID\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"*\"},\"Action\":[\"SNS:Publish\",\"SNS:RemovePermission\",\"SNS:SetTopicAttributes\",\"SNS:DeleteTopic\",\"SNS:ListSubscriptionsByTopic\",\"SNS:GetTopicAttributes\",\"SNS:AddPermission\",\"SNS:Subscribe\"],\"Resource\":\"${AlertsEmailTopic}\",\"Condition\":{\"StringEquals\":{\"AWS:SourceAccount\":\"${AWS::AccountId}\"}}}]}"
            Topics:
              - !Ref AlertsEmailTopic

    AlertsTopicPolicy:   ## Will need some revisions to policy document - Sids etc...
        Type: "AWS::SNS::TopicPolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2008-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__default_statement_ID\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"*\"},\"Action\":[\"SNS:Publish\",\"SNS:RemovePermission\",\"SNS:SetTopicAttributes\",\"SNS:DeleteTopic\",\"SNS:ListSubscriptionsByTopic\",\"SNS:GetTopicAttributes\",\"SNS:AddPermission\",\"SNS:Subscribe\"],\"Resource\":\"${AlertsTopic}\",\"Condition\":{\"StringEquals\":{\"AWS:SourceOwner\":\"${AWS::AccountId}\"}}},{\"Sid\":\"AWSEvents_Health\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsTopic}\"},{\"Sid\":\"AWSEvents\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsTopic}\"},{\"Sid\":\"AWSBudgets\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"budgets.amazonaws.com\"},\"Action\":\"SNS:Publish\",\"Resource\":\"${AlertsTopic}\"},{\"Sid\":\"AWSEvents_ecs-deployment-failed_Id7873fe76-3d16-4609-a77f-4d4adfebc641\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsTopic}\"}]}"
            Topics:
              - !Ref AlertsTopic

    AlertsDhpTopicPolicy:
        Type: "AWS::SNS::TopicPolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2008-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__default_statement_ID\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"*\"},\"Action\":[\"SNS:Publish\",\"SNS:RemovePermission\",\"SNS:SetTopicAttributes\",\"SNS:DeleteTopic\",\"SNS:ListSubscriptionsByTopic\",\"SNS:GetTopicAttributes\",\"SNS:AddPermission\",\"SNS:Subscribe\"],\"Resource\":\"${AlertsDhpTopic}\",\"Condition\":{\"StringEquals\":{\"AWS:SourceOwner\":\"${AWS::AccountId}\"}}},{\"Sid\":\"AWSEvents_Health\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsDhpTopic}\"},{\"Sid\":\"AWSEvents_ACM\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsDhpTopic}\"},{\"Sid\":\"AWSBudgets\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"budgets.amazonaws.com\"},\"Action\":\"SNS:Publish\",\"Resource\":\"${AlertsDhpTopic}\"},{\"Sid\":\"AWSEvents_ecs-deployment-failed\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsDhpTopic}\"},{\"Sid\":\"AWSEvents_Health\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sns:Publish\",\"Resource\":\"${AlertsDhpTopic}\"}]}"
            Topics:
              - !Sub "${AlertsDhpTopic}"


    AlertsTopicChatbotSubscription:
        Type: "AWS::SNS::Subscription"
        Properties:
            TopicArn: !Ref AlertsTopic
            Endpoint: "https://global.sns-api.chatbot.amazonaws.com"
            Protocol: "https"
            RawMessageDelivery: "false"
            Region: !Ref AWS::Region

    AlertsDhpTopicChatbotSubscription:
        Type: "AWS::SNS::Subscription"
        Properties:
            TopicArn: !Sub "${AlertsDhpTopic}"
            Endpoint: "https://global.sns-api.chatbot.amazonaws.com"
            Protocol: "https"
            RawMessageDelivery: "false"
            Region: !Ref AWS::Region

