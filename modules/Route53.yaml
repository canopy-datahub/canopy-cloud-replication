    Route53LoadBalancerAliasRecordSet:
        Type: "AWS::Route53::RecordSet"
        Properties:
            Name: !Sub "${Environment}.radxdatahub.nih.gov"
            Type: "A"
            AliasTarget: 
                HostedZoneId: 
                    Fn::ImportValue: !Sub "RADx-LoadBalancer-${Environment}-LoadBalancer-HostedZoneId"
                DNSName: 
                    Fn::ImportValue: !Sub "RADx-LoadBalancer-${Environment}-LoadBalancer-DNSName"
                EvaluateTargetHealth: true
            HostedZoneId: !Ref Route53HostedZone

