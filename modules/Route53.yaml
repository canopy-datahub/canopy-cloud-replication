AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/10/17 13:52:29
  "This template deploys the NIH RADx Data Hub Route53 Services."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions: 
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod] 
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    Route53HostedZone:
        Type: "AWS::Route53::HostedZone"
        Properties:
            Name: "radxdatahub.nih.gov."
            VPCs: 
              - 
                VPCRegion: "us-east-1"
                VPCId: 
                    Fn::ImportValue: !Sub "RADx-Networking-${Environment}-VPC-ID"

