    Route53LoadBalancerAliasRecordSet:
        Type: "AWS::Route53::RecordSet"
        Properties:
            Name: !Sub "${Environment}.datahub.stanford.edu"
            Type: "A"
            AliasTarget:
                HostedZoneId:
                    Fn::ImportValue: !Sub "${ProjectName}-LoadBalancer-${Environment}-LoadBalancer-HostedZoneId"
                DNSName:
                    Fn::ImportValue: !Sub "${ProjectName}-LoadBalancer-${Environment}-LoadBalancer-DNSName"
                EvaluateTargetHealth: true
            HostedZoneId: !Ref Route53HostedZone

