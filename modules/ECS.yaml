                    ContainerPort: 80
                    HostPort: 80
                    Protocol: "tcp"
                  -
                    ContainerPort: 443
                    HostPort: 443
                    Protocol: "tcp"
                  -
                    ContainerPort: 3000
                    HostPort: 3000
                    Protocol: "tcp"
