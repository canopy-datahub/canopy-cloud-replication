            NetworkMode: "awsvpc"
            RequiresCompatibilities:
              - "EC2"
              - "FARGATE"
            Cpu: "1024"
            Memory: "2048"

    ECSTaskRole:
        Type: "AWS::IAM::Role"
        Properties:
            RoleName: !Sub "${ProjectName}-${Environment}-ECS-Task-Role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: "Allow"
                    Principal:
                        Service: "ecs-tasks.amazonaws.com"
                    Action: "sts:AssumeRole"
            ManagedPolicyArns:
              - "arn:aws:iam::aws:policy/AmazonSQSFullAccess"
              - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
              - "arn:aws:iam::aws:policy/AmazonRDSDataFullAccess"
              - "arn:aws:iam::aws:policy/AmazonOpenSearchServiceFullAccess"
              - "arn:aws:iam::aws:policy/SecretsManagerReadWrite"
              - "arn:aws:iam::aws:policy/AmazonSESFullAccess"
              - "arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess"
              - "arn:aws:iam::aws:policy/AWSLambda_FullAccess"
          
    ECSExecutionRole:
        Type: "AWS::IAM::Role"
        Properties:
            RoleName: !Sub "${ProjectName}-${Environment}-ECS-Execution-Role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: "Allow"
                    Principal:
                        Service: "ecs-tasks.amazonaws.com"
                    Action: "sts:AssumeRole"
            ManagedPolicyArns:
              - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
            Policies:
              - PolicyName: "SecretsManagerAccess"
                PolicyDocument:
                  Version: "2012-10-17"
                  Statement:
                    - Effect: "Allow"
                      Action:
                        - "secretsmanager:GetSecretValue"
                        - "secretsmanager:DescribeSecret"
                      Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}*"

    ECSCluster:
        Type: "AWS::ECS::Cluster"
        Properties:
            ClusterName: !Sub "${ProjectName}-Services-${Environment}"
            CapacityProviders:
              - "FARGATE"
              - "FARGATE_SPOT"
            DefaultCapacityProviderStrategy:
              -
                CapacityProvider: "FARGATE"
                Weight: 0
                Base: 1
              -
                CapacityProvider: "FARGATE_SPOT"
                Weight: 1
                Base: 0

