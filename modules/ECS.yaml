AWSTemplateFormatVersion: "2010-09-09"
Description:  >-
    Last Modified: 2025/10/16 17:06:37
    "DataHub Elastic Container Service (ECS) stack"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: datahub
    AllowedValues:
      - datahub

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    ReportService:
        Type: "AWS::ECS::Service"
        Properties:
            ServiceName: !Sub "${ProjectName}-ReportService"
            Cluster: !GetAtt ECSCluster.Arn
            LoadBalancers:
              -
                TargetGroupArn:
                  Fn::ImportValue: !Sub "DataHub-LoadBalancer-${Environment}-ReportServiceTargetGroup"
                ContainerName: !Sub "${ProjectName}-ReportService"
                ContainerPort: 8080
            DesiredCount: 0
            PlatformVersion: "LATEST"
            TaskDefinition: !Ref ReportServiceTaskDefinition
            DeploymentConfiguration:
                MaximumPercent: 200
                MinimumHealthyPercent: 100
                DeploymentCircuitBreaker:
                    Enable: true
                    Rollback: true
            NetworkConfiguration:
                AwsvpcConfiguration:
                    AssignPublicIp: "DISABLED"
                    SecurityGroups:
                      - Fn::ImportValue: !Sub DataHub-Networking-${Environment}-ECS-Host-SecurityGroup
                    Subnets:
                      - Fn::ImportValue: !Sub "DataHub-Networking-${Environment}-Private-Subnet-AZ1"
                      - Fn::ImportValue: !Sub "DataHub-Networking-${Environment}-Private-Subnet-AZ2"
            HealthCheckGracePeriodSeconds: 300
            SchedulingStrategy: "REPLICA"
            DeploymentController:
                Type: "ECS"
            CapacityProviderStrategy:
              -
                CapacityProvider: "FARGATE"
                Weight: 0
                Base: 0
              -
                CapacityProvider: "FARGATE_SPOT"
                Weight: 1
                Base: 0

    UserService:
        Type: "AWS::ECS::Service"
        Properties:
            ServiceName: !Sub "${ProjectName}-UserService"
