                    LogDriver: "awslogs"
                    Options:
                        awslogs-group: !Sub "/aws/ecs/datahub-microservices-${Environment}"
                        awslogs-region: !Ref AWS::Region
                        awslogs-stream-prefix: "entity-service"
                Memory: 1024
                Name: !Sub "${ProjectName}-EntityService"
                PortMappings:
                  -
                    ContainerPort: 8080
                    HostPort: 8080
                    Protocol: "tcp"
            Family: !Sub "datahub-entityservice-${Environment}"
            TaskRoleArn: !Ref ECSTaskRole
            ExecutionRoleArn: !Ref ECSExecutionRole
            NetworkMode: "awsvpc"
            RequiresCompatibilities:
              - "EC2"
              - "FARGATE"
            Cpu: "512"
            Memory: "1024"

    ApprovedServiceTaskDefinition:
        Type: "AWS::ECS::TaskDefinition"
        Properties:
