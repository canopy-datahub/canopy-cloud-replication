    EntityServiceTaskDefinition:
        Type: "AWS::ECS::TaskDefinition"
        Properties:
            ContainerDefinitions:
              -
                Cpu: 512
                Environment:
                  -
                    Name: "SPRING_PROFILES_ACTIVE"
                    Value: !Ref Environment
                Secrets:
                  - Name: DATAHUB_SPRING_MANAGEMENT_USER
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:DATAHUB_SPRING_MANAGEMENT_USER::"

                  - Name: DATAHUB_SPRING_MANAGEMENT_PASSWORD
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:DATAHUB_SPRING_MANAGEMENT_PASSWORD::"

                  - Name: dbuser
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:dbuser::"

                  - Name: password
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:password::"

                  - Name: host
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:host::"

                  - Name: port
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:port::"

                  - Name: dbname
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:dbname::"

                  - Name: dbDriverClassName
                    ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:application_${Environment}:dbDriverClassName::"

                Essential: true
                HealthCheck:
                    Command:
                      - "CMD-SHELL"
                      - "curl -f http://localhost:8080/api/entity/v1/actuator/health || exit 1"
                    Interval: 30
                    Timeout: 5
                    Retries: 3
                    StartPeriod: 300
                Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/datahub-entityservice/${Environment}:latest"
