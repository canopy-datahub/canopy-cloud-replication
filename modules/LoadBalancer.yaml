AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "Load Balancer stack"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - staging
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: canopy
  CertificateId:
    Type: String
    Description: ACM Certificate ID for HTTPS

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    CanopyPublicLoadBalancer:
        Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
        Properties:
            Name: !Sub "${ProjectName}-${Environment}"
            Scheme: "internet-facing"
            Type: "application"
            Subnets:
              - Fn::ImportValue: !Sub ${ProjectName}-Networking-${Environment}-Public-Subnet-AZ1
              - Fn::ImportValue: !Sub ${ProjectName}-Networking-${Environment}-Public-Subnet-AZ2
            SecurityGroups:
              - Fn::ImportValue: !Sub ${ProjectName}-Networking-${Environment}-LoadBalancer-SecurityGroup
            IpAddressType: "ipv4"
            LoadBalancerAttributes:
              -
                Key: "access_logs.s3.enabled"
                Value: "false"
              -
                Key: "idle_timeout.timeout_seconds"
                Value: "60"
              -
                Key: "deletion_protection.enabled"
                Value: "false"
              -
                Key: "routing.http2.enabled"
                Value: "true"
              -
                Key: "routing.http.drop_invalid_header_fields.enabled"
                Value: "false"
              -
                Key: "routing.http.xff_client_port.enabled"
                Value: "false"
              -
                Key: "routing.http.preserve_host_header.enabled"
                Value: "false"
              -
                Key: "routing.http.xff_header_processing.mode"
                Value: "append"
              -
                Key: "load_balancing.cross_zone.enabled"
                Value: "true"
              -
                Key: "routing.http.desync_mitigation_mode"
                Value: "defensive"
              -
                Key: "client_keep_alive.seconds"
                Value: "3600"
              -
                Key: "waf.fail_open.enabled"
                Value: "false"
              -
                Key: "routing.http.x_amzn_tls_version_and_cipher_suite.enabled"
                Value: "false"
              -
                Key: "zonal_shift.config.enabled"
                Value: "false"
              -
                Key: "connection_logs.s3.enabled"
                Value: "false"

    HttpLoadBalancerListener:
        Type: "AWS::ElasticLoadBalancingV2::Listener"
        Properties:
            LoadBalancerArn: !Ref CanopyPublicLoadBalancer
            Port: 80
            Protocol: "HTTP"
            DefaultActions:
              -
                Type: "redirect"
                RedirectConfig:
                    Protocol: "HTTPS"
                    Port: "443"
                    StatusCode: "HTTP_301"

    HttpsLoadBalancerListener:
        Type: "AWS::ElasticLoadBalancingV2::Listener"
        Properties:
            LoadBalancerArn: !Ref CanopyPublicLoadBalancer
            Port: 443
            Protocol: "HTTPS"
            SslPolicy: "ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04"
            Certificates:
              - CertificateArn: !Sub "arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/${CertificateId}"
            DefaultActions:
              -
                Order: 1
                TargetGroupArn: !Ref UIServiceTargetGroup
                Type: "forward"

    UserServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "20"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/user/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref UserServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref UserServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    EntityServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "30"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/entity/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref EntityServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref EntityServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    DownloadServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "40"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/download/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref DownloadServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref DownloadServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    ReportServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "50"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/report/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref ReportServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref ReportServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    SearchServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "60"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/search/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref SearchServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref SearchServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    S3ResourcesListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "70"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - !Sub "/${ProjectName}-s3-resources*"
                      - "/variables-explorer*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref S3TargetGroup
                Order: 1
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref S3TargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false
                        DurationSeconds: 3600

    SubmissionServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "80"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/submission/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref SubmissionServiceTargetGroup
                ForwardConfig:
