AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "EventBridge Rules for Lambda Functions"
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - staging
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: canopy
  DeploymentId:
    Type: String
    Description: Unique identifier used in S3 bucket names (must match S3 stack)

Resources:

    # Rule name includes ProjectName so multiple projects in the same account each get their own rule.
    # Event pattern filters by this project's SFTP bucket so only its uploads trigger this rule.
    SftpRule:
        Type: "AWS::Events::Rule"
        Properties:
            Name: !Sub "${ProjectName}-SFTP-${Environment}"
            Description: !Sub "S3 Object Created for ${ProjectName} SFTP bucket → SFTP queue"
            EventPattern: !Sub "{\"source\":[\"aws.s3\"],\"detail-type\":[\"Object Created\"],\"detail\":{\"bucket\":{\"name\":[\"${ProjectName}-sftp-${DeploymentId}-${Environment}\"]},\"object\":{\"key\":[{\"prefix\":\"${Environment}\"}]}}}"
            State: "ENABLED"
            Targets:
              -
                Arn:
                  Fn::ImportValue: !Sub "${ProjectName}-SQS-${Environment}-SftpQueue-Arn"
                Id: "SftpQueueTarget"
                DeadLetterConfig:
                    Arn:
                      Fn::ImportValue: !Sub "${ProjectName}-SQS-${Environment}-SftpQueueDLQ-Arn"
            EventBusName: "default"
