AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "Networking stack"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: canopy

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
  CanopyVPC:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.40.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: "default"
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-${Environment}"

  CanopyPublicSubnetAZ2:
    Type: "AWS::EC2::Subnet"
    Properties:
      AvailabilityZone: !GetAtt CanopyPrivateSubnetAZ2.AvailabilityZone
      CidrBlock: "10.40.32.0/20"
      VpcId: !Ref CanopyVPC
      MapPublicIpOnLaunch: true
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Public-Subnet-AZ2-${Environment}"

  CanopyPublicSubnetAZ1:
    Type: "AWS::EC2::Subnet"
    Properties:
      AvailabilityZone: !GetAtt CanopyPrivateSubnetAZ1.AvailabilityZone
      CidrBlock: "10.40.16.0/20"
      VpcId: !Ref CanopyVPC
      MapPublicIpOnLaunch: true
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Public-Subnet-AZ1-${Environment}"

  CanopyPrivateSubnetAZ1:
    Type: "AWS::EC2::Subnet"
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: "10.40.48.0/20"
      VpcId: !Ref CanopyVPC
      MapPublicIpOnLaunch: false
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Private-SubnetAZ1-${Environment}"

  CanopyPrivateSubnetAZ2:
    Type: "AWS::EC2::Subnet"
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: "10.40.64.0/20"
      VpcId: !Ref CanopyVPC
      MapPublicIpOnLaunch: false
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Private-Subnet-AZ2-${Environment}"

  CanopyInternetGateway:
    Type: "AWS::EC2::InternetGateway"
    Properties:
      Tags:
        - Key: "Name"
          Value: !Sub "${ProjectName}-Internet-Gateway-${Environment}"
        - Key: "Environment"
          Value: !Sub "${Environment}"

  CanopyPrivateRoutesAZ1:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref CanopyVPC
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Private-Routes-AZ1-${Environment}"

  CanopyPrivateRoutesAZ2:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref CanopyVPC
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Private-Routes-AZ2-${Environment}"

  CanopyPublicRoutesAZ1:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref CanopyVPC
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Public-Routes-${Environment}"

  CanopyPublicRoutesAZ2:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref CanopyVPC
      Tags:
        - Key: "Environment"
          Value: !Sub "${Environment}"
        - Key: "Name"
          Value: !Sub "${ProjectName}-Public-Routes2-${Environment}"

  EC2Route2:
    Type: "AWS::EC2::Route"
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref EC2NatGateway
      RouteTableId: !Ref CanopyPrivateRoutesAZ1
  
  EC2RoutePrivateAZ2:
    Type: "AWS::EC2::Route"
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref EC2NatGateway
      RouteTableId: !Ref CanopyPrivateRoutesAZ2

  EC2Route3:
    Type: "AWS::EC2::Route"
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref CanopyInternetGateway
      RouteTableId: !Ref CanopyPublicRoutesAZ1

  EC2RoutePublicAZ2:
    Type: "AWS::EC2::Route"
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref CanopyInternetGateway
      RouteTableId: !Ref CanopyPublicRoutesAZ2

  NatGateway1EIP:
    Type: AWS::EC2::EIP
    Properties:
        Domain: vpc

  EC2NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
        AllocationId: !GetAtt NatGateway1EIP.AllocationId
        SubnetId: !Ref CanopyPublicSubnetAZ1
        Tags:
          -
            Key: "Environment"
            Value: !Sub "${Environment}"
          -
            Key: "Name"
            Value: !Sub "${ProjectName}-Nat-Gateway-${Environment}"


  CanopyS3VPCEndpoint:
      Type: "AWS::EC2::VPCEndpoint"
      Properties:
          VpcEndpointType: "Interface"
          VpcId: !Ref CanopyVPC
          ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
          PolicyDocument: |
              {
                "Statement": [
                  {
                    "Action": "*", 
                    "Effect": "Allow", 
                    "Principal": "*", 
                    "Resource": "*"
                  }
                ]
              }
          SubnetIds:
            - !Ref CanopyPrivateSubnetAZ1
            - !Ref CanopyPrivateSubnetAZ2
          PrivateDnsEnabled: false
          SecurityGroupIds:
            - !Ref ECSHostSecurityGroup

  CanopyVPCGatewayAttachment:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      InternetGatewayId: !Ref CanopyInternetGateway
      VpcId: !Ref CanopyVPC

  EC2SubnetRouteTableAssociation:
      Type: "AWS::EC2::SubnetRouteTableAssociation"
      Properties:
        RouteTableId: !Ref CanopyPrivateRoutesAZ1
        SubnetId: !Ref CanopyPrivateSubnetAZ1

  EC2SubnetRouteTableAssociation2:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref CanopyPrivateRoutesAZ2
      SubnetId: !Ref  CanopyPrivateSubnetAZ2

  EC2SubnetRouteTableAssociation3:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
        RouteTableId: !Ref CanopyPublicRoutesAZ1
        SubnetId: !Ref CanopyPublicSubnetAZ1

  EC2SubnetRouteTableAssociation4:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref CanopyPublicRoutesAZ2
      SubnetId: !Ref CanopyPublicSubnetAZ2

  ECSHostSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
          VpcId: !Ref CanopyVPC
          GroupDescription: Access to the ECS hosts and the tasks/containers that run on them
          SecurityGroupIngress:
              # Only allow inbound access to ECS from the ELB
              - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
                IpProtocol: -1
              - CidrIp: 10.40.0.0/16
                IpProtocol: -1
          Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-ECS-Hosts-${Environment}"

  # This security group defines who/where is allowed to access the Application Load Balancer.
  # By default, we've opened this up to the public internet (0.0.0.0/0) but can you restrict
  # it further if you want.
  LoadBalancerSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
          VpcId: !Ref CanopyVPC
          GroupDescription: Access to the load balancer that sits in front of ECS
          SecurityGroupIngress:
              # Allow HTTP access from anywhere (internet-facing ALB)
              - CidrIp: 0.0.0.0/0
                IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                Description: "HTTP access from internet"
              # Allow HTTPS access from anywhere (for future HTTPS setup)
              - CidrIp: 0.0.0.0/0
                IpProtocol: tcp
                FromPort: 443
                ToPort: 443
                Description: "HTTPS access from internet"
              # Allow access from VPC for internal communication
              - CidrIp: 10.40.0.0/16
                IpProtocol: -1
                Description: "Internal VPC access"
          Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-LoadBalancers-${Environment}"

Outputs:
  VpcId:
    Value: !Ref CanopyVPC
    Export:
      Name: !Sub "${AWS::StackName}-VPC-ID"

  PublicSubnetAZ1:
    Value: !Ref CanopyPublicSubnetAZ1
    Export:
      Name: !Sub "${AWS::StackName}-Public-Subnet-AZ1"

  PublicSubnetAZ2:
    Value: !Ref CanopyPublicSubnetAZ2
    Export:
      Name: !Sub "${AWS::StackName}-Public-Subnet-AZ2"

  PrivateSubnetAZ1:
    Value: !Ref CanopyPrivateSubnetAZ1
    Export:
      Name: !Sub "${AWS::StackName}-Private-Subnet-AZ1"

  PrivateSubnetAZ2:
    Value: !Ref CanopyPrivateSubnetAZ2
    Export:
      Name: !Sub "${AWS::StackName}-Private-Subnet-AZ2"

  LoadBalancerSecurityGroup:
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancer-SecurityGroup"

  ECSHostSecurityGroup:
    Value: !Ref ECSHostSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ECS-Host-SecurityGroup"
