AWSTemplateFormatVersion: "2010-09-09"
Description: >-
    Last Modified: 2025/10/17 13:55:07
    "This template deploys the NIH RADx Data Hub RDS Database."
Parameters:
    Environment:
        Type: String
        Description: The Project Environment
        AllowedValues:
          - dev
          - test
          - prod
          - shared
    ProjectName:
        Type: String
        Description: The Project name
        Default: radx
        AllowedValues:
          - radx

Conditions: 
    DEV: !Equals [!Ref Environment, dev]
    TEST: !Equals [!Ref Environment, test]
    PROD: !Equals [!Ref Environment, prod] 
    NOTDEV: !Not [!Equals [!Ref Environment, dev]]
    NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    RDSDBInstance:
        Type: "AWS::RDS::DBInstance"
        Properties:
            DBInstanceIdentifier: !Sub "radx-postgresql-${Environment}"
            AllocatedStorage: 20
            DBInstanceClass: "db.t4g.small"
            Engine: "postgres"
            MasterUsername: !Sub "radxpostgres${Environment}"
            MasterUserPassword: "REPLACEME" ## Replace this value with a Secrets Manager secret in production
            DBName: !Sub "${ProjectName}_${Environment}"
            PreferredBackupWindow: "05:00-05:30"
            BackupRetentionPeriod: 3
            AvailabilityZone: !Sub "${AWS::Region}a"
            PreferredMaintenanceWindow: "sun:06:00-sun:06:30"
            MultiAZ: false
            EngineVersion: "16.9"
            AutoMinorVersionUpgrade: true
            LicenseModel: "postgresql-license"
            # Iops: 3000
            PubliclyAccessible: true
            StorageType: "gp3"
            Port: 5432
            StorageEncrypted: true
            # KmsKeyId: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/88cc85e9-4665-41a7-ae8a-a6bf09a4a0d6" # USE aws/rds AWS KMS Key
            CopyTagsToSnapshot: true
            MonitoringInterval: 0
            EnableIAMDatabaseAuthentication: false
            EnablePerformanceInsights: false
            DeletionProtection: true
            DBSubnetGroupName: !Sub "radx-db-subnet-group-${Environment}"
            VPCSecurityGroups: 
              - !Ref RdsSecurityGroup
            MaxAllocatedStorage: 1000
            DBParameterGroupName: !Ref RDSDBParameterGroup
            OptionGroupName: "default:postgres-16"
            CACertificateIdentifier: "rds-ca-rsa2048-g1"

    # RDSDBProxy:
    #     Type: "AWS::RDS::DBProxy"
    #     Properties:
    #         DBProxyName: !Sub "radx-db-proxy-${Environment}"
    #         EngineFamily: "POSTGRESQL"
    #         VpcSecurityGroupIds: 
    #           - "sg-0dc608be5f7eee5f6" ## GET FROM NETWORKING STACK
    #         VpcSubnetIds: 
    #           - "subnet-0835f4ca5509a3ecc" ## GET FROM NETWORKING STACK
    #           - "subnet-041462c76d97c28a0" ## GET FROM NETWORKING STACK
    #         # Auth: ## GET FROM SECRETS MANAGER ONCE COMPLETED
    #         #   - 
    #         #     AuthScheme: "SECRETS"
    #         #     SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RDSDBInstance}/testradxpostgres-IL7dGP"
    #         #     IAMAuth: "DISABLED"
    #         #     ClientPasswordAuthType: "POSTGRES_SCRAM_SHA_256"
    #         #   - 
    #         #     AuthScheme: "SECRETS"
    #         #     SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RDSDBInstance}/radx_admin-VePiXp"
    #         #     IAMAuth: "DISABLED"
    #         #     ClientPasswordAuthType: "POSTGRES_SCRAM_SHA_256"
    #         RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/rds-proxy-role-1697141531813"  ## CREATE HERE
    #         RequireTLS: true
    #         IdleClientTimeout: 1800
    #         DebugLogging: false

    RDSDBSubnetGroup:
        Type: "AWS::RDS::DBSubnetGroup"
        Properties:
            DBSubnetGroupDescription: !Sub "${ProjectName}-db-subnet-group-${Environment}"
            DBSubnetGroupName: !Sub "radx-db-subnet-group-${Environment}"
            SubnetIds: 
              - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
              - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"

    RDSDBParameterGroup:
        Type: "AWS::RDS::DBParameterGroup"
        Properties:
            # DBClusterParameterGroupName: !Sub "db-postgresql-16-${Environment}"
            Description: "Parameter group for the test db with pg_cron enabled"
            Family: "postgres16"
            Parameters: 
                shared_preload_libraries: "pg_stat_statements,pg_tle,pg_cron"

    # RDSDBProxyTargetGroup:
    #     Type: "AWS::RDS::DBProxyTargetGroup"
    #     Properties:
    #         DBProxyName: !Sub "radx-db-proxy-${Environment}"
    #         TargetGroupName: "default"
    #         ConnectionPoolConfigurationInfo: 
    #             MaxConnectionsPercent: 100
    #             MaxIdleConnectionsPercent: 50
    #             ConnectionBorrowTimeout: 120
    #         DBInstanceIdentifiers: 
    #           - !Ref RDSDBInstance

    RdsSecurityGroup:
        Type: "AWS::EC2::SecurityGroup"
        Properties:
            GroupDescription: "Created by RDS management console"
            GroupName: !Sub "${ProjectName}-db-sg-${Environment}"
            VpcId: 
                Fn::ImportValue: !Sub "RADx-Networking-${Environment}-VPC-ID"
            # Tags: 
            #   - 
            #     Key: "Name"
            #     Value: "RADx-PROD-DB"
            SecurityGroupIngress: 
              - CidrIp: "10.31.0.0/16"
                Description: "Control VPC"
                FromPort: 0
                IpProtocol: "tcp"
                ToPort: 65535

              - CidrIp: "10.40.0.0/16"
                FromPort: 5432
                IpProtocol: "tcp"
                ToPort: 5432

              - SourceSecurityGroupId: 
                  Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
                SourceSecurityGroupOwnerId: !Ref AWS::AccountId
                Description: "ECS Services"
                FromPort: 5432
                IpProtocol: "tcp"
                ToPort: 5432

              # - SourceSecurityGroupId: !Ref RdsSecurityGroup
              #   SourceSecurityGroupOwnerId: !Ref AWS::AccountId
              #   Description: "Proxy & DB SG"
              #   FromPort: 5432
              #   IpProtocol: "tcp"
              #   ToPort: 5432
                
            SecurityGroupEgress: 
              - CidrIp: "0.0.0.0/0"
                Description: "Allow all outbound traffic"
                IpProtocol: "-1"

