AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/10/16 17:06:37
  "This template deploys the Data Hub ECR repositories."

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: datahub
    AllowedValues:
      - datahub

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    ReporterRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-reporter/${Environment}"

    ReportServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-report-service/${Environment}"

    UserInterfaceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-ui/${Environment}"

    SearchServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-search/${Environment}"

    EntityServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-entityservice/${Environment}"

    OpenSearchRefreshRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-opensearchrefresh/${Environment}"

    SubmissionServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-submission-service/${Environment}"

    PublicationScriptRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-publicationscript/${Environment}"

    ApprovedDataServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-approved-data-service/${Environment}"

    DownloadServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-download-service/${Environment}"

    UserServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "datahub-user-service/${Environment}"

