AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "S3 Buckets stack - Bucket names must be globally unique"
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name (must be lowercase for S3 bucket names; e.g. redwood not Redwood)
    Default: datahub
  DataHubUniqueId:
    Type: String
    Description: A unique identifier to ensure S3 bucket names are globally unique (must be lowercase for S3 bucket names)
    Default: stanford

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
  ## Required by application
  S3BucketDataHubUploadPortal:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      BucketName: !Sub "${ProjectName}-upload-portal-${DataHubUniqueId}-${Environment}"
    # Fn::Transform:
    #   Name: String
    #   Parameters:
    #     InputString: !Sub "${ProjectName}-upload-portal-${Environment}"
    #     Operation: Lower
    # Fn::Transform:
    #   Name: Lower
    #   Parameters:
    #     Value: !Sub "${ProjectName}-upload-portal-${Environment}"
      # BucketName: !Transform
      #   Name: LowerCase
      #   Parameters:
      #     Value: !Sub "${ProjectName}-upload-portal-${Environment}" # Or any other string you want to convert
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"

  ## Required by SFTP server for user home directories
  S3BucketSftpDataHub:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "${ProjectName}-sftp-${DataHubUniqueId}-${Environment}"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: false
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"
      ## May be using EventBridge instead of S3 Events
      # NotificationConfiguration:
      #   QueueConfigurations: []
      #   LambdaConfigurations: []
      #   EventBridgeConfiguration:
      #     EventBridgeEnabled: true
      #   TopicConfigurations:
      #   - Topic: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:SFTP-Object-Upload-Topic-${Environment}" ##FIXME - Parameterize SNS Topic ARN
      #     Filter:
      #       S3Key:
      #         Rules:
      #         - Value: "test/"
      #           Name: "Prefix"
      #     Event: "s3:ObjectCreated:*"
      #   - Topic: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:SFTP-Object-Upload-Topic-${Environment}" ##FIXME - Parameterize SNS Topic ARN
      #     Filter:
      #       S3Key:
      #         Rules:
      #         - Value: "prod/"
      #           Name: "Prefix"
      #         - Value: ""
      #           Name: "Suffix"
      #     Event: "s3:ObjectCreated:*"
      # VersioningConfiguration:
      #   Status: "Enabled"
      Tags:
      - Value: "SFTP"
        Key: "Name"

  ## Required by Submission for in-review files for PII processing
  S3BucketDataHubReview:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "${ProjectName}-review-${DataHubUniqueId}-${Environment}"
      VersioningConfiguration:
        Status: "Enabled"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"
      # LoggingConfiguration:
      #   TargetObjectKeyFormat:
      #     PartitionedPrefix:
      #       PartitionDateSource: "EventTime"
      #   DestinationBucketName: "datahub-s3-access-logging" ##FIXME - Parameterize Access Log Bucket Name
      #   LogFilePrefix: ""

