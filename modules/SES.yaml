#
# SES and the email lambda:
# - The lambda sends mail with From = supportEmail (from SecretsManager) and To/Cc from the request.
# - supportEmail and StakeholderEmailsStudyReg (and other addresses) can appear as sender or recipients.
# - You must verify the SENDER (supportEmail) in SES. Domain "stanford.edu" is verified below, so any
#   *@stanford.edu (e.g. ycao77@stanford.edu) can be used as supportEmail without adding an identity.
# - In SES SANDBOX mode, every recipient (To/Cc, including StakeholderEmailsStudyReg) must also be
#   verified (SES → Verified identities → Create identity). In production, only the sender must be verified.
#
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2026/01/20 14:30:00
  "SES Services stack"
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: datahub

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    DataHubEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "datahub@stanford.edu"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    DataHubDevEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "datahub.dev@stanford.edu"
            DkimAttributes:
                SigningEnabled: false
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    StanfordEduEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "stanford.edu"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true
