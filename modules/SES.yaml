# Should be rescanned on us-west-2
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/09/30 14:48:53
  "This template deploys the Data Hub SES Services."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: datahub
    AllowedValues:
      - datahub

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    DataHubEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "datahub@stanford.edu"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    DataHubDevEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "datahub.dev@stanford.edu"
            DkimAttributes:
                SigningEnabled: false
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    StanfordEduEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "stanford.edu"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true
